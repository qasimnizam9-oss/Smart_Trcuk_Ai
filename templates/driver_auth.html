<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner Access | Smart Truck</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #0f172a;
            --accent: #4f46e5;
            --success: #10b981;
            --error: #ef4444;
            --bg-dark: #0f172a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }

        body {
            background: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .auth-graphic {
            background: linear-gradient(135deg, var(--primary), var(--secondary)), 
                        url('https://images.unsplash.com/photo-1601584115197-04ecc0da31d7?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80') center/cover;
            background-blend-mode: overlay;
            padding: 50px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .auth-form-wrapper { padding: 60px 50px; }

        h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 10px; }
        h2 { font-size: 1.8rem; color: var(--secondary); margin-bottom: 5px; }
        p { color: #64748b; margin-bottom: 30px; }

        label { display: block; font-size: 0.85rem; font-weight: 700; color: var(--secondary); margin-bottom: 8px; text-transform: uppercase; }
        input {
            width: 100%;
            padding: 14px 15px;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 1rem;
            transition: 0.3s;
        }
        input:focus { border-color: var(--primary); outline: none; background: white; }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-primary:hover { background: var(--accent); transform: translateY(-2px); }

        .toggle-link { color: var(--primary); font-weight: 600; text-decoration: none; cursor: pointer; }

        @media (max-width: 768px) {
            .auth-container { grid-template-columns: 1fr; }
            .auth-graphic { display: none; }
        }

        #auth-error {
            display: none;
            padding: 12px;
            background: #fef2f2;
            color: var(--error);
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-graphic">
            <h1>Partner Portal</h1>
            <p>Join the elite fleet and maximize your earnings with Smart Truck OS.</p>
        </div>
        <div class="auth-form-wrapper">
            <div id="auth-header-container">
                <h2 id="auth-title">Welcome Back</h2>
                <p id="auth-subtitle">Login to your Partner Dashboard</p>
            </div>

            <div id="auth-error"></div>

            <div id="signup-extras" style="display: none;">
                <label>Full Name</label>
                <input type="text" id="reg-name" placeholder="e.g. Qasim Nizam">
                <label>Phone Number</label>
                <input type="tel" id="reg-phone" placeholder="+92 300 1234567">
            </div>

            <label>Email Address</label>
            <input type="email" id="auth-email" placeholder="name@example.com">

            <label>Password</label>
            <input type="password" id="auth-pass" placeholder="••••••••">

            <button class="btn-primary" id="auth-btn" onclick="handleAuth()">Login</button>

            <p style="text-align:center; margin-top:25px; font-size:0.95rem;">
                <span id="toggle-text">New driver?</span>
                <span class="toggle-link" onclick="toggleAuth()" id="toggle-link">Apply to Drive</span>
            </p>
            
            <a href="/driver" style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 30px; color: #64748b; text-decoration: none; font-weight: 600; font-size: 0.95rem; transition: 0.3s;" onmouseover="this.style.color='var(--primary)'" onmouseout="this.style.color='#64748b'">
                <i class="fas fa-arrow-left"></i> Return to Partner Terminal
            </a>
        </div>
    </div>

    <script>
        let isLoginMode = true;

        function toggleAuth() {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-title').innerText = isLoginMode ? 'Welcome Back' : 'Join the Fleet';
            document.getElementById('auth-subtitle').innerText = isLoginMode ? 'Login to your Partner Dashboard' : 'Apply for a Smart Truck Partner Account';
            document.getElementById('signup-extras').style.display = isLoginMode ? 'none' : 'block';
            document.getElementById('auth-btn').innerText = isLoginMode ? 'Login' : 'Create Account';
            document.getElementById('toggle-text').innerText = isLoginMode ? 'New driver?' : 'Already a partner?';
            document.getElementById('toggle-link').innerText = isLoginMode ? 'Apply to Drive' : 'Login instead';
            document.getElementById('auth-error').style.display = 'none';
        }

        async function handleAuth() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-pass').value;
            const errorEl = document.getElementById('auth-error');
            const btn = document.getElementById('auth-btn');

            if (!email || !password) {
                errorEl.innerText = "Please fill all fields";
                errorEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.innerText = "Processing...";
            errorEl.style.display = 'none';

            const endpoint = isLoginMode ? '/api/driver/login' : '/api/driver/signup';
            const body = isLoginMode ? { email, password } : {
                email, password,
                name: document.getElementById('reg-name').value,
                phone: document.getElementById('reg-phone').value
            };

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();

                if (res.ok) {
                    if (isLoginMode) {
                        localStorage.setItem('smart_truck_driver_id', data.driver_id);
                        window.location.href = '/driver/dashboard';
                    } else {
                        alert("Account created! Please login.");
                        toggleAuth();
                    }
                } else {
                    errorEl.innerText = data.message;
                    errorEl.style.display = 'block';
                }
            } catch (err) {
                errorEl.innerText = "Connection error. Please try again.";
                errorEl.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerText = isLoginMode ? 'Login' : 'Create Account';
            }
        }
    </script>
</body>
</html>
