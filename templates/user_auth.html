<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Access | Smart Truck</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #0f172a;
            --accent: #3b82f6;
            --success: #10b981;
            --error: #ef4444;
            --bg-glass: rgba(255, 255, 255, 0.9);
            --border-glass: rgba(255, 255, 255, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.8)), 
                        url('https://images.unsplash.com/photo-1586528116311-ad8ed745d20c?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') center/cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 480px;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-glass);
            position: relative;
            overflow: hidden;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .brand-logo {
            width: 70px;
            height: 70px;
            background: var(--primary);
            color: white;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            margin: 0 auto 20px;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
        }

        .auth-header h2 {
            font-size: 2rem;
            color: var(--secondary);
            font-weight: 800;
            margin-bottom: 8px;
        }

        .auth-header p {
            color: #64748b;
            font-size: 1rem;
            font-weight: 400;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 35px;
            background: #f1f5f9;
            padding: 6px;
            border-radius: 12px;
        }

        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 12px 0;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .auth-tab.active {
            color: var(--primary);
            background: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .input-group {
            margin-bottom: 22px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            color: var(--secondary);
            transition: all 0.3s ease;
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .btn-submit {
            width: 100%;
            margin-top: 10px;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 20px -5px rgba(37, 99, 235, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .form-section {
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        .form-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        .back-home {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 30px;
            color: #64748b;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        .back-home:hover {
            color: var(--primary);
        }

        #authError, #authSuccess {
            display: none;
            padding: 15px;
            border-radius: 12px;
            margin-top: 25px;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
            border-left: 5px solid transparent;
        }
        
        #authError {
            background: #fff1f2;
            color: #be123c;
            border-left-color: #e11d48;
        }
        
        #authSuccess {
            background: #f0fdf4;
            color: #15803d;
            border-left-color: #22c55e;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <div class="brand-logo">
                <i class="fas fa-truck-fast"></i>
            </div>
            <h2>Smart Truck Enterprise</h2>
            <p>Global Logistics at your fingertips.</p>
        </div>

        <div class="auth-tabs">
            <div class="auth-tab active" onclick="switchTab('login')">Account Login</div>
            <div class="auth-tab" onclick="switchTab('signup')">New Registration</div>
        </div>

        <!-- Login Form -->
        <div id="loginSection" class="form-section active">
            <form id="loginForm">
                <div class="input-group">
                    <label>Corporate Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="loginEmail" required placeholder="name@company.com">
                    </div>
                </div>
                <div class="input-group">
                    <label>Secure Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-shield-halved"></i>
                        <input type="password" id="loginPassword" required placeholder="••••••••">
                    </div>
                </div>
                <button type="submit" class="btn-submit">
                    Authorize & Enter
                </button>
            </form>
        </div>

        <!-- Signup Form -->
        <div id="signupSection" class="form-section">
            <form id="signupForm">
                <div class="input-group">
                    <label>Full Name</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user-tie"></i>
                        <input type="text" id="signupName" required placeholder="Johnathan Doe">
                    </div>
                </div>
                <div class="input-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="signupEmail" required placeholder="you@company.com">
                    </div>
                </div>
                <div class="input-group">
                    <label>Contact Number</label>
                    <div class="input-wrapper">
                        <i class="fas fa-phone"></i>
                        <input type="tel" id="signupPhone" required placeholder="+92 300 1234567">
                    </div>
                </div>
                <div class="input-group">
                    <label>Choose Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="signupPassword" required placeholder="Minimum 8 characters">
                    </div>
                </div>
                <button type="submit" class="btn-submit">
                    Create Corporate Profile
                </button>
            </form>
        </div>

        <div id="authError"></div>
        <div id="authSuccess"></div>

        <a href="/" class="back-home"><i class="fas fa-arrow-left"></i> Return to Terminal</a>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
            
            if (tab === 'login') {
                document.querySelectorAll('.auth-tab')[0].classList.add('active');
                document.getElementById('loginSection').classList.add('active');
            } else {
                document.querySelectorAll('.auth-tab')[1].classList.add('active');
                document.getElementById('signupSection').classList.add('active');
            }
            hideMessages();
        }

        function hideMessages() {
            document.getElementById('authError').style.display = 'none';
            document.getElementById('authSuccess').style.display = 'none';
        }

        function showMessage(type, msg) {
            hideMessages();
            const el = document.getElementById(type === 'error' ? 'authError' : 'authSuccess');
            el.innerText = msg;
            el.style.display = 'block';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/user/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        email: document.getElementById('loginEmail').value,
                        password: document.getElementById('loginPassword').value
                    })
                });
                const data = await res.json();
                
                if (res.ok) {
                    localStorage.setItem('smart_truck_user_id', data.user_id);
                    localStorage.setItem('smart_truck_user_name', data.name);
                    showMessage('success', 'Authorization successful! Accessing terminal...');
                    setTimeout(() => window.location.href = '/user/dashboard', 1000);
                } else {
                    showMessage('error', data.message);
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            } catch (err) {
                console.error("Login Error:", err);
                showMessage('error', 'Security Protocol: Connection to authentication server failed. Please ensure the backend is running.');
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Provisioning Profile...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/user/signup', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        name: document.getElementById('signupName').value,
                        email: document.getElementById('signupEmail').value,
                        phone: document.getElementById('signupPhone').value,
                        password: document.getElementById('signupPassword').value
                    })
                });
                const data = await res.json();
                
                if (res.ok) {
                    showMessage('success', 'Corporate profile created! Please authorize login.');
                    setTimeout(() => switchTab('login'), 1500);
                } else {
                    showMessage('error', data.message);
                }
            } catch (err) {
                console.error("Signup Error:", err);
                showMessage('error', 'Provisioning Failed: Could not connect to central server. Check your network.');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
