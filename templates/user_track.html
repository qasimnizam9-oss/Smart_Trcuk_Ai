<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Shipment | Smart Truck</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            background-color: var(--bg-main);
        }

        #map {
            flex: 1;
            height: 100vh;
            z-index: 1;
        }

        .tracking-panel {
            width: 350px;
            background: white;
            box-shadow: -5px 0 15px rgba(0,0,0,0.05);
            z-index: 2;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .panel-header {
            padding: 25px;
            background: var(--primary);
            color: white;
        }

        .panel-header h2 {
            color: white;
            margin: 0 0 10px 0;
            font-size: 1.5rem;
        }

        .status-badge {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .panel-content {
            padding: 25px;
            flex: 1;
            overflow-y: auto;
        }

        .info-block {
            margin-bottom: 25px;
        }

        .info-label {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 5px;
            display: block;
        }

        .info-value {
            color: var(--text-main);
            font-weight: 600;
            font-size: 1.1rem;
        }

        .driver-card {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            margin-top: 10px;
        }

        .driver-avatar {
            width: 50px;
            height: 50px;
            background: var(--bg-hover);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--primary);
        }

        .driver-info h4 {
            margin: 0;
            color: var(--secondary);
        }

        .driver-info p {
            margin: 0;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .back-btn {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            padding: 12px;
            background: var(--bg-hover);
            color: var(--secondary);
            text-align: center;
            text-decoration: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            transition: var(--transition);
        }

        .back-btn:hover {
            background: var(--border);
        }

        @media (max-width: 1024px) {
            .tracking-panel { width: 300px; }
        }

        @media (max-width: 768px) {
            body { flex-direction: column; overflow: hidden; }
            #map { height: 50vh !important; flex: none; }
            .tracking-panel { 
                width: 100% !important; 
                flex: 1; 
                height: 50vh !important;
                border-top-left-radius: 24px;
                border-top-right-radius: 24px;
                margin-top: -24px;
                box-shadow: 0 -10px 30px rgba(0,0,0,0.1);
                overflow-y: auto;
            }
            .panel-header { padding: 20px !important; }
            .panel-content { padding: 20px !important; }
            .back-btn { position: static !important; margin-top: 20px; width: 100%; display: block; }
        }

        /* Chat Styles */
        .chat-container {
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            height: 300px;
            background: #f8fafc;
        }

        .chat-header {
            padding: 10px 15px;
            background: var(--bg-hover);
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #chatMessages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-msg {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 0.9rem;
            position: relative;
        }

        .msg-user {
            align-self: flex-end;
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .msg-driver {
            align-self: flex-start;
            background: white;
            border: 1px solid var(--border);
            border-bottom-left-radius: 2px;
        }

        .msg-time {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-top: 4px;
            display: block;
            text-align: right;
        }

        .chat-input-area {
            display: flex;
            padding: 10px;
            background: white;
            border-top: 1px solid var(--border);
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 8px 15px;
            outline: none;
        }

        .send-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="tracking-panel">
        <div class="panel-header">
            <h2>Track Shipment</h2>
            <div class="status-badge"><i class="fas fa-circle-notch fa-spin" style="margin-right: 5px;"></i> In Transit</div>
        </div>
        <div class="panel-content">
            <div class="info-block">
                <span class="info-label">Booking ID</span>
                <span class="info-value" id="trackBookingId">Loading...</span>
            </div>
            
            <div class="info-block">
                <span class="info-label">Route</span>
                <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;">
                    <div style="display: flex; gap: 10px; align-items: flex-start;">
                        <i class="fas fa-map-marker-alt" style="color: #2563eb; margin-top: 4px;"></i>
                        <span id="trackPickup" style="font-weight: 500;">...</span>
                    </div>
                    <div style="border-left: 2px dashed #cbd5e1; height: 20px; margin-left: 5px;"></div>
                    <div style="display: flex; gap: 10px; align-items: flex-start;">
                        <i class="fas fa-flag-checkered" style="color: #10b981; margin-top: 4px;"></i>
                        <span id="trackDropoff" style="font-weight: 500;">...</span>
                    </div>
                </div>
            </div>

            <div class="info-block">
                <span class="info-label">Assigned Driver</span>
                <div class="driver-card">
                    <img id="trackDriverPic" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" style="width: 50px; height: 50px; border-radius: 50%; object-fit: cover;">
                    <div class="driver-info">
                        <h4 id="trackDriverName">...</h4>
                        <p id="trackDriverVehicle" style="font-size: 0.75rem; font-weight: 600; color: var(--primary);">V-0000 • Standard Truck</p>
                        <p><i class="fas fa-star" style="color: #f59e0b;"></i> 4.8 Rating</p>
                    </div>
                </div>
            </div>

            <!-- Chat with Driver -->
            <div class="chat-container">
                <div class="chat-header">
                    <i class="fas fa-comments"></i> Chat with Driver
                </div>
                <div id="chatMessages">
                    <div style="text-align: center; color: var(--text-muted); margin-top: 50px; font-size: 0.85rem;">
                        Loading messages...
                    </div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="Type a message..." onkeypress="if(event.key === 'Enter') sendUserMessage()">
                    <button class="send-btn" onclick="sendUserMessage()">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
            
            <a href="/user/dashboard" class="back-btn" style="position: static; margin-top: 25px; display: block;"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const bookingId = new URLSearchParams(window.location.search).get('booking_id') || {{ booking_id | tojson | safe }};
        let map;
        let truckMarker;

        // Custom Truck Icon
        const truckIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/3204/3204121.png',
            iconSize: [40, 40],
            iconAnchor: [20, 20]
        });

        async function initTracking() {
            try {
                const res = await fetch(`/api/booking/${bookingId}`);
                const data = await res.json();

                if (res.ok) {
                    document.getElementById('trackBookingId').innerText = `#BK-${data.id}`;
                    document.getElementById('trackPickup').innerText = data.pickup;
                    document.getElementById('trackDropoff').innerText = data.dropoff;
                    document.getElementById('trackDriverName').innerText = data.driver_name;
                    document.getElementById('trackDriverPic').src = data.driver_pic;
                    document.getElementById('trackDriverVehicle').innerText = data.driver_vehicle;

                    // Initialize Map
                    const driverLat = data.driver_lat || 31.5204;
                    const driverLon = data.driver_lon || 74.3587;
                    const pickupLat = data.pickup_lat || driverLat;
                    const pickupLon = data.pickup_lon || driverLon;
                    const dropoffLat = data.dropoff_lat || (pickupLat + 0.05);
                    const dropoffLon = data.dropoff_lon || (pickupLon + 0.05);

                    if (!map) {
                        map = L.map('map').setView([driverLat, driverLon], 13);
                        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                            attribution: '&copy; OpenStreetMap &copy; CARTO'
                        }).addTo(map);

                        // Add static markers
                        L.marker([pickupLat, pickupLon]).addTo(map).bindPopup('Pickup Location');
                        L.marker([dropoffLat, dropoffLon]).addTo(map).bindPopup('Dropoff Location');

                        // Draw Route Line
                        const latlngs = [[pickupLat, pickupLon], [dropoffLat, dropoffLon]];
                        L.polyline(latlngs, {color: '#2563eb', weight: 4, dashArray: '10, 10'}).addTo(map);

                        // Add Real-time Truck Marker
                        truckMarker = L.marker([driverLat, driverLon], {icon: truckIcon}).addTo(map);
                        
                        map.fitBounds(L.polyline(latlngs).getBounds(), {padding: [50, 50]});
                    } else {
                        // Update existing truck position
                        if (truckMarker) {
                            truckMarker.setLatLng([driverLat, driverLon]);
                            // Smoothly pan map to follow truck if it's the active view
                            // map.panTo([driverLat, driverLon], { animate: true });
                        }
                    }
                }
            } catch (err) {
                console.error("Tracking Error:", err);
            }
        }

        // --- Chat Functionality ---
        async function loadUserChat() {
            try {
                const res = await fetch(`/api/chat/${bookingId}`);
                if (res.ok) {
                    const messages = await res.json();
                    const container = document.getElementById('chatMessages');
                    
                    if (messages.length === 0) {
                        container.innerHTML = '<div style="text-align: center; color: var(--text-muted); margin-top: 50px; font-size: 0.85rem;">No messages yet. Send a greeting!</div>';
                        return;
                    }

                    const html = messages.map(msg => {
                        const isUser = msg.sender === 'user';
                        return `
                            <div class="chat-msg ${isUser ? 'msg-user' : 'msg-driver'}">
                                ${msg.message}
                                <span class="msg-time">${msg.time}</span>
                            </div>
                        `;
                    }).join('');
                    
                    // Only update if content changed to avoid scroll jumping
                    if (container.innerHTML !== html) {
                        container.innerHTML = html;
                        container.scrollTop = container.scrollHeight;
                    }
                }
            } catch (err) {
                console.error("Chat Error:", err);
            }
        }

        async function sendUserMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (!message) return;

            input.value = '';
            try {
                const res = await fetch(`/api/chat/${bookingId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sender: 'user', message: message })
                });
                if (res.ok) {
                    loadUserChat();
                }
            } catch (err) {
                console.error("Send Error:", err);
            }
        }

        initTracking();
        // Start live tracking & chat polling
        setInterval(initTracking, 5000); 
        loadUserChat();
        setInterval(loadUserChat, 3000);
    </script>
</body>
</html>
